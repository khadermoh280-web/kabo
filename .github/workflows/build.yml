name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q KaboApp_v3.zip
      - run: sed -i 's#google()#google(); maven { url = uri("https://jitpack.io") }#' KaboApp/settings.gradle.kts
      - run: sed -i '/windowLayoutDirection/d' KaboApp/app/src/main/res/values/themes.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: KaboApp
      - uses: actions/upload-artifact@v4
        with:
          name: kabo-apk
          path: KaboApp/app/build/outputs/apk/debug/app-debug.apk
